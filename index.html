<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MESSAGE SAVER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@900&display=swap');

    body {
      margin: 0;
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMOGD0sgkP81APBU3phn-GybYKXugGvPiaDq0Yfof2G7Sklx_-4rcgJq1W&s=10') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Gothic A1', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 30px;
      text-shadow: 2px 2px black;
    }
    .fingerprint {
      width: 150px;
      height: 150px;
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIBIBNJ-60A8_hYos0gZMX957yqYjPjn6tc_h-TJTNn9_3vu4vuXabIvPX&s=10') no-repeat center;
      background-size: contain;
      animation: pulse 1.5s infinite;
      cursor: pointer;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>MESSAGE SAVER</h1>
  <div class="fingerprint" id="fingerprint"></div>

  <script>
    let pressTimer;
    const fp = document.getElementById("fingerprint");

    fp.addEventListener("mousedown", () => {
      pressTimer = setTimeout(() => {
        window.location.href = "login.html";
      }, 5000);
    });

    fp.addEventListener("mouseup", () => {
      clearTimeout(pressTimer);
    });

    fp.addEventListener("mouseleave", () => {
      clearTimeout(pressTimer);
    });
  </script>
</body>
</html>
